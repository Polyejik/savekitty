name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          cp -r _parts public/_parts
          cp progress.csv public/progress.csv
          cp Kotik.mp4 public/Kotik.mp4
          cp pushok-praise.js public/pushok-praise.js
          cp game-ui-v5.js public/game-ui-v5.js
          cp onboarding-v5.js public/onboarding-v5.js
          cp onboarding-skip-v1.js public/onboarding-skip-v1.js
          cp hint-ui-v1.js public/hint-ui-v1.js
          cp locks-ui-v1.js public/locks-ui-v1.js
          cp share-ui-v1.js public/share-ui-v1.js
          cp supabase-config.js public/supabase-config.js
          cp supabase-sync-v2.js public/supabase-sync-v2.js
          cp -r dashboard public/dashboard
          cp CNAME public/CNAME

          test -s pushok_hq.jpg
          cp pushok_hq.jpg public/pushok_hq.jpg

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          anchor="html=html.replace('</head>','<script src=\"pushok-praise.js?v=2\"><\\/script></head>');"
          patterns=[
            r"html=html\.replace\('</head>','<script src=\\\"game-ui-v[45]\.js\?v=\d+\\\"><\\\\/script></head>'\);",
            r"html=html\.replace\('</head>','<script src=\\\"intro-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",
            r"html=html\.replace\('</head>','<script src=\\\"onboarding-v[12345]\.js\?v=\d+\\\"><\\\\/script></head>'\);",
            r"html=html\.replace\('</head>','<script src=\\\"onboarding-skip-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",
            r"html=html\.replace\('</head>','<script src=\\\"hint-ui-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",
            r"html=html\.replace\('</head>','<script src=\\\"locks-ui-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",
            r"html=html\.replace\('</head>','<script src=\\\"share-ui-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",
            r"html=html\.replace\('</head>','<script src=\\\"supabase-config\.js\?v=\d+\\\"><\\\\/script></head>'\);",
            r"html=html\.replace\('</head>','<script src=\\\"supabase-sync-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);"
          ]
          for pat in patterns:s=re.sub(pat,'',s)
          game="html=html.replace('</head>','<script src=\"game-ui-v5.js?v=1\"><\\/script></head>');"
          onboard="html=html.replace('</head>','<script src=\"onboarding-v5.js?v=1\"><\\/script></head>');"
          skip="html=html.replace('</head>','<script src=\"onboarding-skip-v1.js?v=1\"><\\/script></head>');"
          hint="html=html.replace('</head>','<script src=\"hint-ui-v1.js?v=1\"><\\/script></head>');"
          locks="html=html.replace('</head>','<script src=\"locks-ui-v1.js?v=1\"><\\/script></head>');"
          share="html=html.replace('</head>','<script src=\"share-ui-v1.js?v=1\"><\\/script></head>');"
          cfg="html=html.replace('</head>','<script src=\"supabase-config.js?v=2\"><\\/script></head>');"
          sync="html=html.replace('</head>','<script src=\"supabase-sync-v2.js?v=2\"><\\/script></head>');"
          if anchor not in s:raise SystemExit('praise script injection anchor not found')
          s=s.replace(anchor,anchor+'\n'+game+'\n'+onboard+'\n'+skip+'\n'+hint+'\n'+locks+'\n'+share+'\n'+cfg+'\n'+sync,1)
          p.write_text(s,encoding='utf-8')
          PY

          test -s public/index.html
          test -s public/Kotik.mp4
          test -s public/pushok-praise.js
          test -s public/game-ui-v5.js
          test -s public/onboarding-v5.js
          test -s public/onboarding-skip-v1.js
          test -s public/hint-ui-v1.js
          test -s public/locks-ui-v1.js
          test -s public/share-ui-v1.js
          test -s public/supabase-config.js
          test -s public/supabase-sync-v2.js
          test -s public/pushok_hq.jpg
          test -s public/dashboard/index.html
          test -s public/dashboard/config.js
          grep -q 'share-ui-v1.js?v=1' public/index.html
          grep -q 'supabase-config.js?v=2' public/index.html
          grep -q 'supabase-sync-v2.js?v=2' public/index.html
          ! grep -q 'supabase-sync-v1.js' public/index.html
          grep -q 'save-pushok-pilot' public/supabase-config.js
          grep -q 'Storage.prototype.setItem' public/supabase-sync-v2.js
          grep -q 't.me/share/url' public/share-ui-v1.js
          grep -q 'max.ru/:share' public/share-ui-v1.js
          grep -q 'Sponsor Dashboard' public/dashboard/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
