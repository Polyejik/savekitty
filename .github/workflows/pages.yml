name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build final game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat _parts/p00.b64 _parts/p01.b64 _parts/p02.b64 _parts/p03.b64 _parts/p04.b64 _parts/p05.b64 _parts/p06.b64 _parts/p07.b64 > /tmp/game.b64
          base64 -d /tmp/game.b64 > /tmp/game.html.gz
          gzip -dc /tmp/game.html.gz > public/index.html
          cp progress.csv public/progress.csv
          test -s public/index.html
          grep -q 'Спаси Пушка' public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
