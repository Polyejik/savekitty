name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          cp -r _parts public/_parts
          cp progress.csv public/progress.csv
          cp Kotik.mp4 public/Kotik.mp4
          cp pushok-praise.js public/pushok-praise.js
          cp game-ui-v4.js public/game-ui-v4.js
          cp CNAME public/CNAME

          # Publish the original user-supplied JPEG byte-for-byte.
          if [[ -f pushok_hq.jpg ]]; then
            cp pushok_hq.jpg public/pushok_hq.jpg
          fi

          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          anchor="html=html.replace('</head>','<script src=\"pushok-praise.js?v=2\"><\\/script></head>');"
          for oldver in ('4','5','6'):
              old=f"html=html.replace('</head>','<script src=\"game-ui-v4.js?v={oldver}\"><\\/script></head>');"
              s=s.replace(old,"")
          new="html=html.replace('</head>','<script src=\"game-ui-v4.js?v=7\"><\\/script></head>');"
          if 'game-ui-v4.js?v=7' not in s:
              if anchor not in s:
                  raise SystemExit('praise script injection anchor not found')
              s=s.replace(anchor, anchor+'\n'+new, 1)
          p.write_text(s,encoding='utf-8')
          PY

          test -s public/index.html
          test -s public/Kotik.mp4
          test -s public/pushok-praise.js
          test -s public/game-ui-v4.js
          test -s public/pushok_hq.jpg
          grep -q 'game-ui-v4.js?v=7' public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
