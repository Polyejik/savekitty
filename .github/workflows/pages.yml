name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public && mkdir -p public
          cp index.html public/index.html
          cp -r _parts public/_parts
          cp progress.csv Kotik.mp4 pushok-praise.js game-ui-v5.js onboarding-v5.js onboarding-skip-v1.js hint-ui-v1.js locks-ui-v1.js share-ui-v5.js name-memory-v2.js finish-ui-v1.js finish-extra-v1.js supabase-config.js supabase-sync-v2.js public/
          cp -r dashboard public/dashboard
          cp CNAME public/CNAME
          test -s pushok_hq.jpg && cp pushok_hq.jpg public/pushok_hq.jpg

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          src=Image.open('pushok_hq.jpg').convert('RGB'); W,H=1200,630
          canvas=Image.new('RGB',(W,H),(18,13,10)); left_w=700
          ratio=max(left_w/src.width,H/src.height); rw,rh=int(src.width*ratio),int(src.height*ratio)
          hero=src.resize((rw,rh),Image.Resampling.LANCZOS); x=max(0,(rw-left_w)//2); y=max(0,(rh-H)//2)
          canvas.paste(hero.crop((x,y,x+left_w,y+H)),(0,0)); canvas=canvas.convert('RGBA')
          overlay=Image.new('RGBA',(W,H),(0,0,0,0)); od=ImageDraw.Draw(overlay)
          for xx in range(520,W): od.line((xx,0,xx,H),fill=(15,11,9,int(220*min(1,max(0,(xx-520)/260)))))
          canvas=Image.alpha_composite(canvas,overlay); d=ImageDraw.Draw(canvas)
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          fb=ImageFont.truetype(bold,58); fm=ImageFont.truetype(reg,30); fs=ImageFont.truetype(reg,25); fbtn=ImageFont.truetype(bold,27)
          cream=(255,244,218,255); gold=(255,193,57,255); ink=(36,25,16,255)
          d.multiline_text((690,86),'Помоги\nосвободить\nПушка',font=fb,fill=cream,spacing=-2)
          d.multiline_text((694,360),'Я уже справился,\nмой результат ты узнаешь\nпосле игры',font=fm,fill=cream,spacing=7)
          bx0,by0,bx1,by1=690,520,1125,590; d.rounded_rectangle((bx0,by0,bx1,by1),radius=30,fill=gold)
          label='ПРИНЯТЬ ВЫЗОВ  →'; bb=d.textbbox((0,0),label,font=fbtn)
          d.text(((bx0+bx1-(bb[2]-bb[0]))/2,(by0+by1-(bb[3]-bb[1]))/2-3),label,font=fbtn,fill=ink)
          d.text((907,601),'spasipushka.ru',font=fs,fill=(224,213,195,255),anchor='ma')
          canvas.convert('RGB').save('public/invite-card.jpg','JPEG',quality=90,optimize=True,progressive=True)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html'); s=p.read_text(encoding='utf-8')
          anchor="html=html.replace('</head>','<script src=\"pushok-praise.js?v=2\"><\\/script></head>');"
          patterns=[r"html=html\.replace\('</head>','<script src=\\\"game-ui-v[45]\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"intro-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"onboarding-v[12345]\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"onboarding-skip-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"hint-ui-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"locks-ui-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"share-ui-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"name-memory-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"finish-ui-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"finish-extra-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"supabase-config\.js\?v=\d+\\\"><\\\\/script></head>'\);",r"html=html\.replace\('</head>','<script src=\\\"supabase-sync-v\d+\.js\?v=\d+\\\"><\\\\/script></head>'\);"]
          for pat in patterns:s=re.sub(pat,'',s)
          scripts=['game-ui-v5.js?v=1','onboarding-v5.js?v=1','onboarding-skip-v1.js?v=1','hint-ui-v1.js?v=2','locks-ui-v1.js?v=1','finish-ui-v1.js?v=1','finish-extra-v1.js?v=1','share-ui-v5.js?v=2','name-memory-v2.js?v=2','supabase-config.js?v=2','supabase-sync-v2.js?v=3']
          if anchor not in s:raise SystemExit('praise script injection anchor not found')
          inject='\n'.join("html=html.replace('</head>','<script src=\"%s\"><\\/script></head>');"%x for x in scripts)
          s=s.replace(anchor,anchor+'\n'+inject,1);p.write_text(s,encoding='utf-8')
          PY

          for f in index.html Kotik.mp4 pushok-praise.js game-ui-v5.js onboarding-v5.js onboarding-skip-v1.js hint-ui-v1.js locks-ui-v1.js finish-ui-v1.js finish-extra-v1.js share-ui-v5.js name-memory-v2.js supabase-config.js supabase-sync-v2.js pushok_hq.jpg invite-card.jpg dashboard/index.html dashboard/config.js; do test -s "public/$f"; done
          grep -q 'share-ui-v5.js?v=2' public/index.html
          grep -q 'finish-extra-v1.js?v=1' public/index.html
          grep -q 'hint-ui-v1.js?v=2' public/index.html
          grep -q 'supabase-sync-v2.js?v=3' public/index.html
          grep -q 'spasipushka-api.kutuzovap.workers.dev/game-run' public/supabase-sync-v2.js
          grep -q "event==='completed'" public/supabase-sync-v2.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
