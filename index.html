<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Спаси Пушка!</title><style>html,body{margin:0;background:#17110e;color:#fff;font-family:system-ui,sans-serif}.load{min-height:100vh;display:grid;place-items:center}.load b{font-size:20px}</style></head><body><div class="load"><b>🐾 Загружаем Пушка…</b></div><script>(async()=>{try{let b='';for(let i=0;i<8;i++)b+=await(await fetch('_parts/p'+String(i).padStart(2,'0')+'.b64?v=11')).text();let raw=Uint8Array.from(atob(b),c=>c.charCodeAt(0));let ds=new DecompressionStream('gzip');let html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();html=html.replace(' .hero{height:620px;margin:0}',' .hero{height:620px;margin:0}\n .hero img{height:112%;object-position:center top}');let css=`<style>.honorBtn{border:1px solid #a97931;border-radius:10px;background:#fff0bd;color:#5f3d18;padding:7px 10px;font-size:12px;font-weight:950;cursor:pointer;white-space:nowrap}.honor{display:none;position:fixed;inset:0;background:rgba(18,11,7,.82);z-index:30;align-items:center;justify-content:center;padding:16px}.honor.show{display:flex}.honorCard{width:min(430px,100%);max-height:82vh;overflow:auto;background:#fff3cf;border:2px solid #ddb25d;border-radius:20px;padding:18px;box-shadow:0 18px 60px #0008;text-align:center}.honorCard h2{margin:2px 0 4px;font-size:25px}.honorSub{font-size:13px;color:#765b3e;margin-bottom:12px;font-weight:800}.honorList{display:grid;gap:7px;text-align:left}.honorRow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:#fffaf0;border:1px solid #e4c98f;border-radius:12px;padding:9px 10px;font-weight:900}.honorRank{font-size:18px;text-align:center}.honorTime{color:#2f75a7;font-variant-numeric:tabular-nums}.honorEmpty{padding:18px;color:#806b55;font-weight:800}.honorClose{margin-top:13px;border:0;border-radius:11px;background:#4a3424;color:#fff3d7;padding:10px 16px;font-weight:900;cursor:pointer}</style>`;html=html.replace('</head>',css+'</head>');html=html.replace('<div id="levelBadge" style="font-weight:950">Ур. 1</div>','<div style="display:flex;align-items:center;gap:7px"><button class="honorBtn" id="honorBtn" type="button">🏆 Доска почёта</button><div id="levelBadge" style="font-weight:950">Ур. 1</div></div>');let modal='<div class="honor" id="honor" aria-hidden="true"><div class="honorCard"><h2 id="honorTitle">🏆 Доска почёта</h2><div class="honorSub" id="honorSub">Лучшие спасатели Пушка на этом устройстве</div><div class="honorList" id="honorList"></div><button class="honorClose" id="honorClose" type="button">Закрыть</button></div></div>';html=html.replace('<div class="finish" id="finish">',modal+'<div class="finish" id="finish">');let js=`<script>addEventListener('DOMContentLoaded',()=>{const K='savekitty_honor_v1',q=id=>document.getElementById(id),read=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}},fmt=ms=>{let s=Math.max(0,Math.round(ms/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')},esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let a=read(),box=q('honorList');box.innerHTML=a.length?a.slice(0,10).map((r,i)=>'<div class="honorRow"><div class="honorRank">'+(['🥇','🥈','🥉'][i]||('#'+(i+1)))+'</div><div>'+esc(r.name)+'</div><div class="honorTime">'+fmt(r.ms)+'</div></div>').join(''):'<div class="honorEmpty">Здесь появятся лучшие результаты после первого спасения Пушка.</div>'}q('honorBtn')?.addEventListener('click',()=>{render();q('honor').classList.add('show')});q('honorClose')?.addEventListener('click',()=>q('honor').classList.remove('show'));q('honor')?.addEventListener('click',e=>{if(e.target===q('honor'))q('honor').classList.remove('show')});let f=q('finish'),saved=false;if(f)new MutationObserver(()=>{if(f.classList.contains('show')&&!saved){saved=true;let name=(q('winTime')?.textContent||'').match(/работа,\\s*([^!]+)!/i)?.[1]||'Спасатель',started=window.gameStartedAt||0,ended=window.gameSolvedAt||Date.now(),ms=ended-started;if(ms>0&&started){let a=read();a.push({name,ms,at:Date.now()});a.sort((x,y)=>x.ms-y.ms);localStorage.setItem(K,JSON.stringify(a.slice(0,10)))}}}).observe(f,{attributes:true,attributeFilter:['class']})});<\/script>`;html=html.replace('</body>',js+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>Не удалось загрузить игру. Обнови страницу.</b></div>';console.error(e)}})();</script></body></html>
