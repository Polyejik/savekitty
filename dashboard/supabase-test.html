<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supabase test</title><script src="config.js"></script><style>body{font-family:system-ui,-apple-system,sans-serif;background:#17110e;color:#f7ecd7;margin:0;padding:20px}.card{max-width:720px;margin:auto;background:#241b16;border:1px solid #4a392e;border-radius:18px;padding:18px}.ok{color:#9bd27d}.bad{color:#ff9d91}pre{white-space:pre-wrap;word-break:break-word;background:#120d0a;padding:12px;border-radius:12px;font-size:12px}button{padding:12px 16px;border:0;border-radius:12px;font-weight:800;background:#d9ad63;color:#27190b}</style></head><body><div class="card"><h2>Проверка Supabase</h2><div id="local"></div><button id="run">Запустить тест записи</button><h3>Результат</h3><pre id="out">Нажми кнопку.</pre></div><script>
const C=window.SAVEKITTY_SUPABASE||{};const out=document.getElementById('out');
function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
function localInfo(){let a=[];try{a=JSON.parse(localStorage.getItem('savekitty_analytics_v1')||'[]')||[]}catch(e){};const err=localStorage.getItem('savekitty_supabase_last_error');const ok=localStorage.getItem('savekitty_supabase_last_ok');document.getElementById('local').innerHTML=`<p>Локальных завершений игры: <b>${a.filter(x=>x&&x.completed).length}</b></p><p>Последний sync OK: <b>${ok||'нет'}</b></p><p>Последняя ошибка: <b>${err||'нет'}</b></p>`}
localInfo();
document.getElementById('run').onclick=async()=>{out.textContent='Отправляю…';try{const now=new Date(),start=new Date(now-1000);const p={campaign_id:C.campaignId,player_id:uuid(),player_name:'DIAGNOSTIC',language:'ru',started_at:start.toISOString(),completed_at:now.toISOString(),duration_seconds:1,locks_opened:9,examples_solved:9,game_version:'diag'};const r=await fetch(C.url.replace(/\/$/,'')+'/rest/v1/game_runs',{method:'POST',headers:{apikey:C.anonKey,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(p)});const t=await r.text();out.textContent=`HTTP ${r.status}\n${t||'(пустой ответ)'}`;out.className=r.ok?'ok':'bad'}catch(e){out.textContent='NETWORK ERROR\n'+String(e);out.className='bad'};localInfo()};
</script></body></html>
